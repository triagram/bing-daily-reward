# Runs the test suite on a clean machine.
#
# Runs on every push to main, and on demand from the Actions tab (`workflow_dispatch`).
# It was manual-only until 2026-09-17, while the suite settled; enabled once the
# observation window had closed on 14 clean days with the suite green throughout.
#
# What this catches that running pytest locally does not: a dependency used but never
# declared, a Python version assumption, and anything else the development machine
# happens to have. The local .venv has had packages installed and removed for weeks;
# this proves a fresh clone works.
#
# It never touches a Microsoft account. The tests parse a synthetic fixture and make
# no network requests — the browser is never launched.

name: tests

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q
