[project]
name = "bing-daily-reward"
version = "0.1.0"
description = "Automated agent for Microsoft Bing Rewards daily tasks, driven by Playwright."
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
authors = [{ name = "Triagram" }]

dependencies = [
    # Pinned exactly: each Playwright release expects a matching Chromium build,
    # so bumping this requires re-running `playwright install chromium`.
    "playwright==1.61.0",
    "rich>=15.0.0",
]

[tool.uv]
package = false
